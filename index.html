<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВкусВилл — Интернет-магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <style>
    </style>
</head>
<body class="d-flex flex-column min-h-100">

    <header>
        <nav class="navbar md:navbar-expand bg-1 border-bottom">
            <div class="container-fluid">
              <a class="navbar-brand fw-bold text-success" href="#">ВкусВилл</a>
              <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
              </button>
              <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                <div class="drawer-header">
                  <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body mb-2 md:mb-0">
                  <ul class="nav navbar-nav me-auto">
                    <li class="nav-item">
                      <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                      <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item">
                      <button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false">
                        Menu
                      </button>
                      <div class="menu">
                        <a class="menu-item" href="#">Action</a>
                        <a class="menu-item" href="#">Another action</a>
                        <hr class="menu-divider">
                        <a class="menu-item" href="#">Something else here</a>
                      </div>
                    </li>
                    <li class="nav-item">
                      <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                  </ul>
                  <form class="hstack gap-2" role="search">
                    <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn-outline theme-success" type="submit">Search</button>
                  </form>
                </div>
              </dialog>
            </div>
          </nav>
    </header>

    <main class="flex-grow-1">
        <!-- Секция Карусели Рекламы -->
        <section class="carousel-container">
            <div id="carouselStacked" class="carousel slide" data-bs-autoplay="true">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h4 class="fw-bold mb-0">Интересное сегодня</h4>
                  <div class="hstack gap-2">
                    <button class="btn-icon btn-sm btn-outline theme-success rounded-circle" type="button" data-bs-target="#carouselStacked" data-bs-slide="prev">
                      <span class="carousel-icon-prev" aria-hidden="true"></span>
                      <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="btn-icon btn-sm btn-outline theme-success rounded-circle" type="button" data-bs-target="#carouselStacked" data-bs-slide="next">
                      <span class="carousel-icon-next" aria-hidden="true"></span>
                      <span class="visually-hidden">Next</span>
                    </button>
                  </div>
                </div>
                <div class="carousel-inner rounded-5 karusel shadow-sm">
                  <div class="carousel-item active h-100">
                    <img src="карусель1.webp" class="d-block w-100 h-100 object-fit-cover" alt="">
                  </div>
                  <div class="carousel-item h-100">
                    <img src="карусель2.webp" class="d-block w-100 h-100 object-fit-cover" alt="">
                  </div>
                  <div class="carousel-item h-100">
                    <img src="карусель3.webp" class="d-block w-100 h-100 object-fit-cover" alt="">
                  </div>
                </div>
            </div>
        </section>

            
            <div class="row row-cols-2 md:row-cols-3 lg:row-cols-4 g-4">
                
                <div class="col">
                    <div class="card h-100 product-card rounded-4 overflow-hidden border-subtle">
                        <div class="product-img-wrapper">
                            <img src="https://img.vkusvill.ru/pim/images/site/site_Mini_SquareWebP/e871f3a0-dc5f-42d6-97ae-ed25ce09700a.webp?1783423043" class="img-fluid object-fit-contain p-2" alt="Бананы">
                        </div>
                        <div class="card-body p-3 d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="card-title fs-sm fw-semibold text-truncate mb-1">Бананы</h5>
                                <p class="text-muted fs-xs mb-3">1 кг</p>
                            </div>
                            <div class="hstack justify-content-between align-items-center mt-auto">
                                <span class="fw-bold fs-md">99 ₽</span>
                                <button class="btn btn-sm btn-solid theme-success rounded-pill px-3">В корзину</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card h-100 product-card rounded-4 overflow-hidden border-subtle">
                        <div class="product-img-wrapper">
                            <img src="https://img.vkusvill.ru/pim/images/site/site_Mini_SquareWebP/b8524ad6-e56d-428e-82ce-a12d7b3a384e.webp?1782077280" class="img-fluid object-fit-contain p-2" alt="Лук репчатый">
                        </div>
                        <div class="card-body p-3 d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="card-title fs-sm fw-semibold text-truncate mb-1">Лук репчатый</h5>
                                <p class="text-muted fs-xs mb-3">1 кг</p>
                            </div>
                            <div class="hstack justify-content-between align-items-center mt-auto">
                                <span class="fw-bold fs-md">45 ₽</span>
                                <button class="btn btn-sm btn-solid theme-success rounded-pill px-3">В корзину</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    </footer>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
